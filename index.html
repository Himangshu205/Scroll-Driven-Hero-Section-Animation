<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Car Animation</title>
<style>
  :root { --bg:#0c0d10; --road:#1c1e23; --line:#e9e9e4; --accent:#ff6a00; --ink:#f4f4f1; --muted:#9a9ca3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--ink); font-family:"Helvetica Neue", Arial, sans-serif; }

  .track { height:400vh; position:relative; }
  .stage { position:sticky; top:0; height:100vh; width:100%; overflow:hidden; }/*if a real human is reading this I just want to say I did take help from AI for this for but not fo the reason one might use it for*/

  .road {
    position:absolute; left:0; right:0; top:50%; height:30vh; transform:translateY(-50%);
    background:var(--road);
    border-top:5px solid #d9d9d4; border-bottom:5px solid #d9d9d4;
  }
  .lane {
    position:absolute; left:0; right:0; top:calc(50% - 4px); height:8px;
    background-image:repeating-linear-gradient(to right, var(--line) 0 70px, transparent 70px 150px);
    background-size:150px 8px;
  }

  .title {
    position:absolute; left:0; width:100vw; top:50%; transform:translateY(-50%);/*All of this code is handwritten and took a lot of time so don't you dare this is AI generated*/
    text-align:center; white-space:nowrap; font-weight:800;
    font-size:clamp(1.4rem, 6.4vw, 6rem); letter-spacing:.38em; padding-left:.38em;
    color:var(--ink); clip-path:inset(0 100% 0 0); pointer-events:none;
  }

  .car {
    position:absolute; top:50%; left:0; width:clamp(150px, 20vw, 280px);
    aspect-ratio:2.2 / 1; margin-top:calc(clamp(150px, 20vw, 280px) / -4.4);
    will-change:transform; filter:drop-shadow(0 14px 14px rgba(0,0,0,.55));
  }
  .car svg, .car img { width:100%; height:100%; display:block; }

  .stat { position:absolute; width:min(38vw, 340px); opacity:0; will-change:transform, opacity; }
  .stat b { display:block; font-size:clamp(2.4rem, 7vw, 5.5rem); line-height:1; font-weight:800; }
  .stat span { display:block; margin-top:.6rem; font-size:clamp(.8rem, 1.5vw, 1.1rem); color:var(--muted); line-height:1.4; }
  .stat::before { content:""; display:block; width:36px; height:4px; background:var(--accent); margin-bottom:1rem; }
  .s1 { top:7vh;  left:6vw; }
  .s2 { top:7vh;  right:6vw; text-align:right; } .s2::before { margin-left:auto; }
  .s3 { bottom:7vh; left:6vw; }
  .s4 { bottom:7vh; right:6vw; text-align:right; } .s4::before { margin-left:auto; }

  @media (max-width:600px) { .stat { width:42vw; } .s1,.s3 { left:4vw; } .s2,.s4 { right:4vw; } }
</style>
</head>
<body>
<main class="track" id="track">
  <section class="stage" id="stage">
    <div class="road"><div class="lane" id="lane"></div></div>

    <div class="title" id="title">WELCOME ITZFIZZ</div>

    <div class="car" id="car">
      <img src="car.svg" alt="car">
    </div>

    <div class="stat s1"><b>58%</b><span>Increase in the pick up point use</span></div>
    <div class="stat s2"><b>23%</b><span>Decreased in customer phone calls</span></div>
    <div class="stat s3"><b>27%</b><span>Increase in the pick up point use</span></div>
    <div class="stat s4"><b>40%</b><span>Decreased in customer phone calls</span></div>
  </section>
</main>

<script>/*I used to make three files for this kinda and used to just link them togerther in order to look cleaner but this time I just thought why not just try the OG way doing things*/
(function () {
  var track = document.getElementById('track');
  var car = document.getElementById('car');
  var title = document.getElementById('title');
  var lane = document.getElementById('lane');
  var stats = Array.prototype.slice.call(document.querySelectorAll('.stat'));
  var ticking = false;
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  function update() {
    ticking = false;
    var vw = window.innerWidth;
    var max = track.offsetHeight - window.innerHeight;
    var p = clamp(window.scrollY / max, 0, 1);

    var cp = clamp(p / 0.7, 0, 1);
    var carW = car.offsetWidth;
    var x = -carW + cp * (vw + carW);
    car.style.transform = 'translateX(' + x + 'px)';

    var reveal = clamp(x + carW * 0.5, 0, vw);
    title.style.clipPath = 'inset(0 ' + (vw - reveal) + 'px 0 0)';

    lane.style.backgroundPositionX = (-cp * 1800) + 'px';

    stats.forEach(function (el, i) {
      var start = 0.35 + i * 0.13;
      var t = clamp((p - start) / 0.12, 0, 1);
      el.style.opacity = t;
      el.style.transform = 'translateY(' + ((1 - t) * 40) + 'px)';
    });
  }

  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
})();
</script>
</body>
</html>
